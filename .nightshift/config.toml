## Night Shift local configuration
## For all configuration options, see docs/config-reference.md

[workspace]
merge_strategy = "direct"

[gate]
command = "make check"
timeout = 600

[backend]
provider = "claude"

[orchestrator]
max_budget_usd = 20.0

[platform]
type = "github"

[archetypes.overrides.coder]
model_tier = "ADVANCED"
effort = "high"
compaction = true

[archetypes.overrides.reviewer]
model_tier = "ADVANCED"
max_turns = 120

[archetypes.overrides.reviewer.modes.pre-flight]
model_tier = "STANDARD"
max_turns = 50

