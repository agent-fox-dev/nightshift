[project]
name = "nightshift"
version = "1.0.1"
description = "Standalone CLI for the AgentFox Night Shift fix daemon"
requires-python = ">=3.12"
dependencies = [
    "afaudit>=1.0.0",
    "afcore>=1.0.1",
    "afhub>=1.0.0",
    "afissues>=1.0.0",
    "click>=8.1",
    "rich>=15.0",
    "duckdb>=1.5.5",
]

[project.scripts]
nightshift = "nightshift.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afcore = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../afcore"]
asyncio_mode = "auto"
